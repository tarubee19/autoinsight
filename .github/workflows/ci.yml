name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[all]"
      - name: Lint
        run: ruff check .
      - name: Test (offline mode, local sandbox)
        run: pytest -m "not docker"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Build all images
        run: |
          docker build -f docker/Dockerfile.sandbox -t autoinsight-sandbox:latest .
          docker build -f docker/Dockerfile.api -t autoinsight-api .
          docker build -f docker/Dockerfile.ui -t autoinsight-ui .
          docker build -f docker/Dockerfile.demo -t autoinsight-demo .
      - name: Sandbox tests against the real Docker backend (network isolation, hardening flags)
        run: |
          pip install -e ".[all]"
          pytest -m docker tests/test_sandbox.py
      - name: End-to-end run with the Docker sandbox
        run: |
          pip install -e ".[all]"
          AUTOINSIGHT_SANDBOX_MODE=docker AUTOINSIGHT_LLM_PROVIDER=offline \
            autoinsight run data/sample/telco_churn.csv -q "Find the driving factors behind customer churn" --runs-dir /tmp/ci-runs
      - name: Compose smoke test
        run: |
          docker compose up -d --build
          wait_for() {  # wait_for <url>: retry for up to two minutes, fail if it never answers
            for i in $(seq 1 60); do curl -fs "$1" && echo && return 0; sleep 2; done
            echo "no answer from $1"; docker compose logs; return 1
          }
          wait_for localhost:8000/health
          wait_for localhost:8501/_stcore/health
          docker compose down -v
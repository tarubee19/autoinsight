# Safe default: API + UI in offline mode (vetted templates, no API key, no Docker socket).
#   docker compose up --build        ->  UI http://localhost:8501   API docs http://localhost:8000/docs
#
# To let a real LLM write the code (Claude/OpenAI) run with the override that adds the hardened Docker sandbox:
#   docker compose -f docker-compose.yml -f docker-compose.llm.yml up --build
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      AUTOINSIGHT_LLM_PROVIDER: offline
      AUTOINSIGHT_SANDBOX_MODE: local
      AUTOINSIGHT_API_KEY: ${AUTOINSIGHT_API_KEY:-}
      AUTOINSIGHT_RETENTION_HOURS: ${AUTOINSIGHT_RETENTION_HOURS:-0}
    volumes:
      - ./runs:/app/runs
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    environment:
      API_URL: http://api:8000
      AUTOINSIGHT_API_KEY: ${AUTOINSIGHT_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8501:8501"
    restart: unless-stopped
